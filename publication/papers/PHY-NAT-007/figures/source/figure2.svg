<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <style>
    text {
      font-family: 'Arial', sans-serif;
      font-size: 14px;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
    }
    .subtitle {
      font-size: 16px;
      font-style: italic;
    }
    .axis-label {
      font-size: 16px;
      font-style: italic;
    }
    .math {
      font-style: italic;
    }
    .grid line {
      stroke: #e0e0e0;
      stroke-width: 1;
    }
    .info-density {
      fill: url(#info-gradient);
      opacity: 0.7;
    }
    .curvature-mesh {
      fill: none;
      stroke: #000;
      stroke-width: 0.5;
    }
    .collapse-wave {
      fill: none;
      stroke: #ff5733;
      stroke-width: 2;
    }
    .info-contour {
      fill: none;
      stroke: #3366ff;
      stroke-width: 1.5;
    }
    .spacetime-curve {
      fill: none;
      stroke: #009900;
      stroke-width: 2;
    }
    .annotation {
      font-size: 12px;
    }
    .annotation-line {
      stroke: #333;
      stroke-width: 1;
      stroke-dasharray: 2,2;
    }
    .formula-box {
      fill: white;
      fill-opacity: 0.9;
      stroke: #333;
      stroke-width: 1;
      rx: 5;
      ry: 5;
    }
  </style>
  
  <!-- Gradients -->
  <defs>
    <radialGradient id="info-gradient" cx="400" cy="300" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3366ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3366ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3366ff" stop-opacity="0.1" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" class="title">Informational Curvature and Collapse Dynamics</text>
  <text x="400" y="70" text-anchor="middle" class="subtitle">Self-referential collapse generating gravitational effects</text>
  
  <!-- Background grid (warped to show curvature) -->
  <g class="curvature-mesh">
    <!-- Horizontal curved lines -->
    <path d="M100,100 Q400,60 700,100" class="curvature-mesh" />
    <path d="M100,150 Q400,120 700,150" class="curvature-mesh" />
    <path d="M100,200 Q400,180 700,200" class="curvature-mesh" />
    <path d="M100,250 Q400,240 700,250" class="curvature-mesh" />
    <path d="M100,300 Q400,320 700,300" class="curvature-mesh" />
    <path d="M100,350 Q400,380 700,350" class="curvature-mesh" />
    <path d="M100,400 Q400,440 700,400" class="curvature-mesh" />
    <path d="M100,450 Q400,480 700,450" class="curvature-mesh" />
    <path d="M100,500 Q400,520 700,500" class="curvature-mesh" />
    
    <!-- Vertical curved lines -->
    <path d="M100,100 Q70,300 100,500" class="curvature-mesh" />
    <path d="M150,100 Q120,300 150,500" class="curvature-mesh" />
    <path d="M200,100 Q180,300 200,500" class="curvature-mesh" />
    <path d="M250,100 Q240,300 250,500" class="curvature-mesh" />
    <path d="M300,100 Q290,300 300,500" class="curvature-mesh" />
    <path d="M350,100 Q345,300 350,500" class="curvature-mesh" />
    <path d="M400,100 Q400,300 400,500" class="curvature-mesh" />
    <path d="M450,100 Q455,300 450,500" class="curvature-mesh" />
    <path d="M500,100 Q510,300 500,500" class="curvature-mesh" />
    <path d="M550,100 Q560,300 550,500" class="curvature-mesh" />
    <path d="M600,100 Q620,300 600,500" class="curvature-mesh" />
    <path d="M650,100 Q680,300 650,500" class="curvature-mesh" />
    <path d="M700,100 Q730,300 700,500" class="curvature-mesh" />
  </g>
  
  <!-- Information density field -->
  <circle cx="400" cy="300" r="250" class="info-density" />
  
  <!-- Information contours -->
  <ellipse cx="400" cy="300" rx="60" ry="40" class="info-contour" />
  <ellipse cx="400" cy="300" rx="120" ry="90" class="info-contour" />
  <ellipse cx="400" cy="300" rx="180" ry="140" class="info-contour" />
  <ellipse cx="400" cy="300" rx="240" ry="200" class="info-contour" />
  
  <!-- Collapse wave function -->
  <path d="M100,300 C150,330 200,280 250,320 C300,360 350,250 400,300 C450,350 500,250 550,310 C600,370 650,280 700,310" class="collapse-wave" filter="url(#glow)" />
  
  <!-- Spacetime curvature path -->
  <path d="M100,250 C200,280 300,350 400,380 C500,410 600,350 700,280" class="spacetime-curve" />
  
  <!-- Formula -->
  <rect x="150" y="120" width="320" height="85" class="formula-box" />
  <text x="160" y="145" class="math">U(x, t, ψ) = ∑ₚ [F_p · f_p(x, t)] / [(|x-p|^φ + σ²)^κ]</text>
  <text x="160" y="170" class="math">                + Λ(ψ) · ∇_φ I(x, t)</text>
  <text x="160" y="195" class="math">where: Λ(ψ) = coupling between field and</text>
  <text x="160" y="215" class="math">                informational gradient</text>
  
  <!-- Annotations -->
  <g class="annotations">
    <!-- Information density annotation -->
    <text x="520" y="180" class="annotation">Information density field I(x,t)</text>
    <line x1="515" y1="182" x2="480" y2="200" class="annotation-line" />
    
    <!-- Collapse wave annotation -->
    <text x="250" y="420" class="annotation">Collapse wave function</text>
    <line x1="250" y1="418" x2="280" y2="360" class="annotation-line" />
    
    <!-- Spacetime curvature annotation -->
    <text x="550" y="430" class="annotation">Spacetime curvature</text>
    <line x1="550" y1="428" x2="520" y2="380" class="annotation-line" />
    
    <!-- Information gradient annotation -->
    <text x="300" y="240" class="annotation">∇_φ I(x,t): φ-gradient of</text>
    <text x="300" y="255" class="annotation">information complexity</text>
    <line x1="350" y1="257" x2="390" y2="280" class="annotation-line" />
    
    <!-- Curvature mesh annotation -->
    <text x="120" y="90" class="annotation">Warped coordinate grid showing</text>
    <text x="120" y="105" class="annotation">informational curvature</text>
    <line x1="180" y1="107" x2="200" y2="150" class="annotation-line" />
  </g>
  
  <!-- Points of interest -->
  <circle cx="400" cy="300" r="8" fill="#ff5733" />
  <text x="410" y="290" class="annotation">High information</text>
  <text x="410" y="305" class="annotation">density region</text>
  
  <circle cx="250" cy="320" r="5" fill="#ff5733" />
  <circle cx="550" cy="310" r="5" fill="#ff5733" />
  
  <!-- Key features annotation -->
  <rect x="550" y="120" width="230" height="85" class="formula-box" />
  <text x="560" y="140" class="annotation">Key features:</text>
  <text x="560" y="160" class="annotation">• Higher information density = stronger collapse</text>
  <text x="560" y="180" class="annotation">• Collapse creates spacetime curvature</text>
  <text x="560" y="200" class="annotation">• φ-modulated resonance patterns</text>
</svg> 