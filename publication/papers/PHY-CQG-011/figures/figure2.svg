<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- 标题 -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">
    Consistency of Subharmonic Deviation Parameter Across Multiple Black Hole Merger Events
  </text>

  <!-- 面板边框 -->
  <rect x="50" y="50" width="700" height="120" fill="none" stroke="black" stroke-width="1"/>
  <rect x="50" y="190" width="700" height="120" fill="none" stroke="black" stroke-width="1"/>
  <rect x="50" y="330" width="700" height="120" fill="none" stroke="black" stroke-width="1"/>
  <rect x="50" y="470" width="700" height="120" fill="none" stroke="black" stroke-width="1"/>

  <!-- 面板标签 -->
  <text x="60" y="70" font-family="Arial" font-size="16" font-weight="bold">(a) Posterior Distributions of ε</text>
  <text x="60" y="210" font-family="Arial" font-size="16" font-weight="bold">(b) Joint Posterior of ε and Final Black Hole Mass</text>
  <text x="60" y="350" font-family="Arial" font-size="16" font-weight="bold">(c) Joint Posterior of ε and Black Hole Spin</text>
  <text x="60" y="490" font-family="Arial" font-size="16" font-weight="bold">(d) Residual Power Spectrum</text>

  <!-- 面板 (a): Posterior Distributions -->
  <!-- GW150914 分布 -->
  <path d="M100,140 Q200,70 300,122 Q400,135 500,125 Q600,135 700,140" 
        fill="none" stroke="blue" stroke-width="2"/>
  <!-- GW150914 90% 置信区间 -->
  <path d="M100,140 Q200,70 300,122 Q400,135 500,125 Q600,135 700,140 L700,150 Q600,145 500,135 Q400,145 300,132 Q200,80 100,150 Z" 
        fill="blue" fill-opacity="0.2" stroke="none"/>
  <!-- GW190521 分布 -->
  <path d="M100,145 Q200,90 260,70 Q320,85 400,130 Q500,140 700,145" 
        fill="none" stroke="red" stroke-width="2"/>
  <!-- GW190521 90% 置信区间 -->
  <path d="M100,145 Q200,90 260,70 Q320,85 400,130 Q500,140 700,145 L700,155 Q500,150 400,140 Q320,95 260,80 Q200,100 100,155 Z" 
        fill="red" fill-opacity="0.2" stroke="none"/>
  
  <!-- ε=0.18 标记 -->
  <line x1="265" y1="50" x2="265" y2="170" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="265" y="185" font-family="Arial" font-size="12" text-anchor="middle">ε = 0.18</text>
  
  <!-- x轴标签 -->
  <text x="120" y="165" font-family="Arial" font-size="12" text-anchor="middle">0.0</text>
  <text x="180" y="165" font-family="Arial" font-size="12" text-anchor="middle">0.1</text>
  <text x="240" y="165" font-family="Arial" font-size="12" text-anchor="middle">0.17</text>
  <text x="300" y="165" font-family="Arial" font-size="12" text-anchor="middle">0.19</text>
  <text x="360" y="165" font-family="Arial" font-size="12" text-anchor="middle">0.2</text>
  <text x="480" y="165" font-family="Arial" font-size="12" text-anchor="middle">0.3</text>
  <text x="600" y="165" font-family="Arial" font-size="12" text-anchor="middle">0.4</text>
  <text x="680" y="165" font-family="Arial" font-size="12" text-anchor="middle">0.5</text>
  <text x="400" y="180" font-family="Arial" font-size="14" text-anchor="middle">Subharmonic Parameter ε</text>
  
  <!-- 图例 (a) -->
  <rect x="550" y="60" width="15" height="5" fill="none" stroke="blue" stroke-width="2"/>
  <text x="570" y="65" font-family="Arial" font-size="12">GW150914</text>
  <rect x="550" y="80" width="15" height="5" fill="none" stroke="red" stroke-width="2"/>
  <text x="570" y="85" font-family="Arial" font-size="12">GW190521</text>

  <!-- 面板 (b): Joint Posterior Mass -->
  <!-- 2D等高线 (简化表示) -->
  <ellipse cx="300" cy="250" rx="40" ry="25" fill="none" stroke="blue" stroke-width="1"/>
  <ellipse cx="300" cy="250" rx="70" ry="40" fill="none" stroke="blue" stroke-width="1"/>
  <ellipse cx="300" cy="250" rx="100" ry="60" fill="none" stroke="blue" stroke-width="1"/>
  
  <ellipse cx="450" cy="250" rx="35" ry="30" fill="none" stroke="red" stroke-width="1"/>
  <ellipse cx="450" cy="250" rx="65" ry="45" fill="none" stroke="red" stroke-width="1"/>
  <ellipse cx="450" cy="250" rx="90" ry="60" fill="none" stroke="red" stroke-width="1"/>
  
  <!-- ε=0.18 标记 -->
  <line x1="265" y1="190" x2="265" y2="310" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- 标签 -->
  <text x="300" y="250" font-family="Arial" font-size="12" text-anchor="middle">GW150914</text>
  <text x="300" y="270" font-family="Arial" font-size="12" text-anchor="middle">~62M☉</text>
  <text x="450" y="250" font-family="Arial" font-size="12" text-anchor="middle">GW190521</text>
  <text x="450" y="270" font-family="Arial" font-size="12" text-anchor="middle">~150M☉</text>
  
  <!-- 坐标轴标签 -->
  <text x="400" y="305" font-family="Arial" font-size="14" text-anchor="middle">Subharmonic Parameter ε</text>
  <text x="80" y="250" font-family="Arial" font-size="14" text-anchor="middle" transform="rotate(-90,80,250)">Final Black Hole Mass (M☉)</text>

  <!-- 面板 (c): Joint Posterior Spin -->
  <!-- 2D等高线 (简化表示) -->
  <ellipse cx="300" cy="390" rx="45" ry="30" fill="none" stroke="blue" stroke-width="1"/>
  <ellipse cx="300" cy="390" rx="80" ry="50" fill="none" stroke="blue" stroke-width="1"/>
  <ellipse cx="300" cy="390" rx="110" ry="70" fill="none" stroke="blue" stroke-width="1"/>
  
  <ellipse cx="450" cy="390" rx="40" ry="25" fill="none" stroke="red" stroke-width="1"/>
  <ellipse cx="450" cy="390" rx="70" ry="40" fill="none" stroke="red" stroke-width="1"/>
  <ellipse cx="450" cy="390" rx="95" ry="60" fill="none" stroke="red" stroke-width="1"/>
  
  <!-- ε=0.18 标记 -->
  <line x1="265" y1="330" x2="265" y2="450" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- 标签 -->
  <text x="300" y="390" font-family="Arial" font-size="12" text-anchor="middle">GW150914</text>
  <text x="300" y="410" font-family="Arial" font-size="12" text-anchor="middle">a/M~0.7</text>
  <text x="450" y="390" font-family="Arial" font-size="12" text-anchor="middle">GW190521</text>
  <text x="450" y="410" font-family="Arial" font-size="12" text-anchor="middle">a/M~0.8</text>
  
  <!-- 坐标轴标签 -->
  <text x="400" y="445" font-family="Arial" font-size="14" text-anchor="middle">Subharmonic Parameter ε</text>
  <text x="80" y="390" font-family="Arial" font-size="14" text-anchor="middle" transform="rotate(-90,80,390)">Black Hole Spin (a/M)</text>

  <!-- 面板 (d): Residual Power Spectrum -->
  <!-- 残余功率谱 -->
  <polyline points="100,560 150,550 200,540 230,530 260,550 265,520 270,550 300,545 350,535 370,540 390,530 400,550 430,535 460,530 500,535 550,540 600,545 650,540 700,545" 
            fill="none" stroke="blue" stroke-width="2"/>
  
  <polyline points="100,565 150,555 200,545 230,535 260,560 265,525 270,560 300,550 350,540 370,545 390,535 400,555 430,535 460,530 500,540 550,545 600,550 650,545 700,550" 
            fill="none" stroke="red" stroke-width="2" stroke-opacity="0.5"/>
  
  <!-- 预测的亚谐波频率标记 -->
  <line x1="265" y1="470" x2="265" y2="560" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="265" y="480" font-family="Arial" font-size="10" text-anchor="middle">ω₀/(1+ε)</text>
  
  <line x1="400" y1="470" x2="400" y2="560" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="400" y="480" font-family="Arial" font-size="10" text-anchor="middle">ω₀/(2+ε)</text>
  
  <!-- 坐标轴标签 -->
  <text x="100" y="530" font-family="Arial" font-size="14" text-anchor="start">Residual Power</text>
  <text x="400" y="585" font-family="Arial" font-size="14" text-anchor="middle">Frequency (Hz)</text>
  
  <!-- 图例 (d) -->
  <rect x="550" y="490" width="15" height="5" fill="none" stroke="blue" stroke-width="2"/>
  <text x="570" y="495" font-family="Arial" font-size="12">GW150914</text>
  <rect x="550" y="510" width="15" height="5" fill="none" stroke="red" stroke-width="2" stroke-opacity="0.5"/>
  <text x="570" y="515" font-family="Arial" font-size="12">GW190521</text>
  <rect x="550" y="530" width="15" height="0" fill="none" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="570" y="535" font-family="Arial" font-size="12">Predicted (ε=0.18)</text>
</svg>
